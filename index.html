<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Buddy · Lecture Chat</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  
  <link rel="stylesheet" href="style.css">
  
</head>

<body>
  <div class="app-container">
    <div class="header">
      <div class="logo-area">
        <div class="logo-icon">📚</div>
        <div class="logo-text">Study Buddy <span>· lecture assistant</span></div>
      </div>
      <div class="api-area">
        <div class="api-input-wrapper">
          <i class="fas fa-key"></i>
          <input type="password" id="apiKeyInput" placeholder="sk-or-v1-..." autocomplete="off">
        </div>
        <button class="save-api-btn" id="saveApiBtn"><i class="fas fa-save"></i> Save</button>
        <div class="api-status" id="apiStatus">
          <i class="fas fa-circle" style="font-size: 8px; color: #b0b0b8;"></i> <span>not set</span>
        </div>
      </div>
    </div>

    <div class="main-panel">
      <div class="history-sidebar">
        <div class="history-header">
          <h3>Chat history</h3>
          <button class="new-chat-btn" id="newChatBtn" title="New chat"><i class="fas fa-plus"></i></button>
        </div>
        <div class="history-list" id="historyList">
          <div class="empty-history">No chats yet</div>
        </div>
      </div>

      <div class="chat-area">
        <div class="messages-container" id="messagesContainer"></div>
        <div class="input-footer">
          <div class="file-upload-area">
            <label for="fileInput" class="file-upload-label"><i class="fas fa-paperclip"></i> Upload book / notes (PDF,
              DOCX, TXT...)</label>
            <input type="file" id="fileInput" accept=".txt,.md,.csv,.json,.html,.js,.py,.java,.c,.cpp,.pdf,.docx" />
            <div id="fileBadgeContainer"></div>
          </div>
          <div class="input-row">
            <input type="text" id="messageInput" placeholder="Ask about your lecture or task..." autocomplete="off">
            <button class="send-btn" id="sendBtn"><i class="fas fa-arrow-up"></i></button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
